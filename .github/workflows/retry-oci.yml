name: Retry OCI Instance Creation

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  OCI_REGION: sa-bogota-1
  INSTANCE_NAME: inventario-bot
  SHAPE: VM.Standard.A1.Flex
  OCPUS: "2"
  MEMORY_GB: "12"
  AVAILABILITY_DOMAIN: kQUJ:SA-BOGOTA-1-AD-1

jobs:
  retry-create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCI CLI
        uses: oracle-actions/setup-cli@v1
        with:
          version: latest
        env:
          OCI_CLI_AUTH: api_key

      - name: Find subnet
        id: subnet
        run: |
          SUBNET_ID=$(oci network subnet list --compartment-id "$OCI_TENANCY" \
            --query "data[?\"display-name\"=='inventario-subnet'].id | [0]" --raw-output)
          echo "SUBNET_ID=$SUBNET_ID" >> "$GITHUB_ENV"

      - name: Find Ubuntu image
        id: image
        run: |
          IMAGE_ID=$(oci compute image list --compartment-id "$OCI_TENANCY" \
            --operating-system "Canonical Ubuntu" --operating-system-version "22.04" \
            --shape "$SHAPE" --query "data[0].id" --raw-output)
          echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Check if instance already exists
        id: check
        run: |
          EXISTING=$(oci compute instance list --compartment-id "$OCI_TENANCY" \
            --availability-domain "$AVAILABILITY_DOMAIN" \
            --query "data[?\"display-name\"=='$INSTANCE_NAME'].id | [0]" --raw-output 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Instance already exists: $EXISTING"
            echo "exists=true" >> "$GITHUB_ENV"
          else
            echo "exists=false" >> "$GITHUB_ENV"
          fi

      - name: Try to create instance
        if: env.exists == 'false'
        run: |
          RESULT=$(oci compute instance launch \
            --compartment-id "$OCI_TENANCY" \
            --availability-domain "$AVAILABILITY_DOMAIN" \
            --display-name "$INSTANCE_NAME" \
            --shape "$SHAPE" \
            --shape-config "{\"ocpus\": $OCPUS, \"memoryInGBs\": $MEMORY_GB}" \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --metadata "{\"ssh_authorized_keys\": \"$(curl -s https://github.com/${{ github.actor }}.keys | head -1)\"}" \
            --assign-public-ip true 2>&1 || true)
          echo "$RESULT"
          if echo "$RESULT" | grep -q '"lifecycle-state": "PROVISIONING"\|"lifecycle-state": "RUNNING"'; then
            echo "INSTANCE_CREATED=true" >> "$GITHUB_ENV"
          fi

      - name: Notify via Telegram when created
        if: env.INSTANCE_CREATED == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ADMIN_IDS }}" \
            -d text="✅ Instancia inventario-bot creada exitosamente en OCI!"